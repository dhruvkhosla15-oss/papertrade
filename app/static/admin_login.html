<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<script>try{const th=localStorage.getItem("lfx_theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}</script>
<title>limeFX — Master</title>
<style>
:root{--bg:#0b1220;--card:#121c2e;--line:#1e2a44;--txt:#e6e8ee;--mut:#8da2c0;--dn:#ef4444;--acc:#84cc16}
:root[data-theme="light"]{--bg:#f3f4f6;--card:#ffffff;--line:#e5e7eb;--txt:#111827;--mut:#6b7280;--dn:#dc2626;--acc:#65a30d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:30px;margin-bottom:16px}.lm{color:var(--acc)}.mut{color:var(--mut)}.small{font-size:13px}.dn{color:var(--dn)}.hidden{display:none}
input{width:100%;padding:12px 14px;margin-bottom:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:16px}
button{width:100%;padding:12px 14px;border-radius:10px;border:0;background:var(--acc);color:#0b1220;font-weight:700;font-size:15px;cursor:pointer}
button.ghost{background:transparent;color:var(--txt);border:1px solid var(--line);margin-top:8px}
</style>
</head>
<body>
<!-- The Master page itself is only sent to a logged-in Master (owner's decision, 20 Nov 2026). This page holds nothing but the login. -->
<div id="loginView" class="login">
  <h2 class="brand"><span class="lm">lime</span><span>fx</span> <span class="mut" style="font-size:16px;font-weight:500">Master</span></h2>
  <div id="pwStep"><input id="lu" placeholder="Username" autocapitalize="none" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password">
  <button id="loginBtn">Log in</button></div>
  <div id="otpStep" class="hidden"><p class="small mut" style="margin-bottom:8px">Enter the 6-digit code from your authenticator app</p><input id="lcode" inputmode="numeric" autocomplete="one-time-code" placeholder="123 456" style="font-size:22px;letter-spacing:.2em;text-align:center">
  <button id="otpBtn">Verify</button><button class="ghost" id="otpBack">‹ Back</button></div>
  <p id="loginErr" class="dn small" style="margin-top:10px"></p>
</div>
<script>
const $=s=>document.querySelector(s);let preTok='';
async function api(p,body){const r=await fetch('/api'+p,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body||{})});
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:'Could not log in. Please try again.');return j;}
function go(){location.replace('/admin'+location.search);}
$('#loginBtn').onclick=async()=>{$('#loginErr').textContent='';try{const j=await api('/login',{username:$('#lu').value,password:$('#lp').value});
  if(j.needs_2fa){preTok=j.pre_token;$('#pwStep').classList.add('hidden');$('#otpStep').classList.remove('hidden');$('#lcode').value='';$('#lcode').focus();return;}
  if(!j.is_admin){await api('/logout');$('#loginErr').textContent='This login is for the master only. Users use the main site.';return;}go();}catch(e){$('#loginErr').textContent=e.message;}};
$('#otpBtn').onclick=async()=>{$('#loginErr').textContent='';try{const j=await api('/login/2fa',{pre_token:preTok,code:$('#lcode').value});
  if(j&&j.is_admin===false){await api('/logout');$('#loginErr').textContent='This login is for the master only. Users use the main site.';return;}go();}catch(e){$('#loginErr').textContent=e.message;}};
$('#otpBack').onclick=()=>{$('#otpStep').classList.add('hidden');$('#pwStep').classList.remove('hidden');};
$('#lp').addEventListener('keydown',e=>{if(e.key==='Enter')$('#loginBtn').click()});$('#lcode').addEventListener('keydown',e=>{if(e.key==='Enter')$('#otpBtn').click()});
</script>
</body>
</html>
